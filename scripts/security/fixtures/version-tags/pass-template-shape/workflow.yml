name: Template shape
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_call:
    inputs:
      tag:
        description: Version tag to validate (x.y.z)
        required: false
        type: string
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate version tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        shell: sh
        run: |
          set -eu
          printf '%s\n' "$TAG" >/dev/null
