name: Block glob
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
jobs:
  v:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          case "$os" in
            *nux)
              echo linux
              ;;
            *_test)
              echo test
              ;;
          esac
      - run: >
          case "$os" in
            *nux) echo linux ;;
            *_test) echo test ;;
          esac
