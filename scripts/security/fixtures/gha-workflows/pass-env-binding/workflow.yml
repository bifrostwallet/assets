name: t
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - env:
          TITLE: ${{ github.event.issue.title }}
          REF: ${{ github.head_ref }}
          TAG: ${{ inputs.tag }}
          OUT: ${{ needs.build.outputs.version }}
        run: echo "$TITLE $REF $TAG $OUT"

