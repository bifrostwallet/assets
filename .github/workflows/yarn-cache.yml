# Committed archives in .yarn/cache against the npm registry. Nobody reviews a
# zip, so a commit can swap an archive together with its yarn.lock checksum, and
# a plain install accepts that. --check-cache downloads every package again and
# fails the install (YN0018) when a committed archive is not what the registry
# serves.
#
# Image builds install from the committed cache without this check (CI=true in
# the Dockerfiles), so this job is the gate: release tags are cut from main, and
# main only changes through pull requests. Make "Yarn cache" a required status
# check in the branch ruleset. A repository with a second Yarn project (its own
# yarn.lock and .yarn/cache) adds a pattern and a step for it, as image-proxy
# does for svg-puppeteer. See README.md, Security: Repository rules checked in CI.
#
# A required check must report on every pull request, or GitHub waits for it
# forever. So the job always runs, and downloads only when the lockfile, the
# cache or the Yarn settings changed.

name: Yarn cache

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE: "0"

jobs:
  check-cache:
    name: Yarn cache
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Find changed Yarn inputs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # A manual run always checks.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "root=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          root=false
          if git diff --name-only "$BASE_SHA" HEAD |
            grep -Eq '^(yarn\.lock|\.yarnrc\.yml|\.yarn/|yarn$|\.github/workflows/yarn-cache\.yml$)'; then
            root=true
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Yarn inputs changed: $root."

      - name: Set up Node.js
        if: steps.changes.outputs.root == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # CI=true here, so the launcher does not add the flag: it is spelled out.
      - name: Check committed archives against the registry
        id: root
        if: steps.changes.outputs.root == 'true'
        run: ./yarn install --immutable --check-cache

      - name: Report a broken cache
        if: failure() && steps.root.outcome == 'failure'
        run: |
          MSG="A committed package archive in .yarn/cache does not match what the npm registry serves,"
          MSG="$MSG or the registry check could not finish. Treat this as a possible supply-chain attack:"
          MSG="$MSG do not merge, do not install this branch locally, and find out which commit changed"
          MSG="$MSG the archive (see the YN0018 lines above)."
          echo "::error title=DO NOT MERGE: Yarn cache does not match the registry::$MSG"
          {
            echo "## 🚨 DO NOT MERGE: Yarn cache does not match the npm registry"
            echo
            echo "$MSG"
          } >> "$GITHUB_STEP_SUMMARY"
