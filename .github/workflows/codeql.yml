name: CodeQL

# Code changes on main and on pull requests, plus a weekly scan.
# data/** and other non-code paths do not start a run. The nightly catalog
# pull request only edits data/providers/, so it skips this workflow. CI still
# validates that pull request. A weekly schedule scans the tree anyway.
#
# Code scanning default setup rejects SARIF from this file
# ("advanced configurations cannot be processed when the default setup is
# enabled"). Disable default setup so this workflow is the scan that runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "**/*.md"
      - "**/*.webp"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.gif"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "LICENSE"
      - ".gitattributes"
      - ".gitignore"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - ".yarn/**"
      - ".pnp.cjs"
      - ".pnp.loader.mjs"
  pull_request:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "**/*.md"
      - "**/*.webp"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.gif"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "LICENSE"
      - ".gitattributes"
      - ".gitignore"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - ".yarn/**"
      - ".pnp.cjs"
      - ".pnp.loader.mjs"
  schedule:
    - cron: "30 7 * * 1" # weekly Monday 07:30 UTC

permissions:
  actions: read
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
