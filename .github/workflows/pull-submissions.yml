name: Pull listing submissions

# Pulls verified provider and dapp submissions from the intake bucket and opens
# a pull request. Third parties submit only through the submission dapp
# (dedicated static bucket) + Cloud Run intake; curators review this PR.

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  COREPACK_ENABLE: "0"
  # Repository variable (Settings → Secrets and variables → Actions → Variables)
  INTAKE_BUCKET: ${{ vars.INTAKE_BUCKET }}

jobs:
  pull:
    name: Pull and ingest submissions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require INTAKE_BUCKET variable
        run: |
          if [ -z "${{ vars.INTAKE_BUCKET }}" ]; then
            echo "Set repository variable INTAKE_BUCKET (Settings → Secrets and variables → Actions → Variables)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Read-only access to the intake bucket via Workload Identity Federation
      # (repository secrets GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: ./yarn install --immutable

      - name: Pull submissions from intake bucket
        run: ./yarn pull:submissions

      - name: Verify no outreach PII under data/
        run: ./yarn verify:no-contact-pii

      - name: Open pull request with changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/providers/ data/dapps/
          if git diff --staged --quiet; then
            echo "No submission changes to commit"
            exit 0
          fi

          BRANCH=intake/listing-submissions
          git checkout -B "$BRANCH"
          git commit -m "Add listing submissions from intake"
          git fetch origin "$BRANCH" || true
          git push -u origin "HEAD:refs/heads/$BRANCH" --force-with-lease

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "Listing submissions from intake" \
              --body "$(cat <<'EOF'
          Automated ingest of self-serve listing submissions from the intake bucket.

          **Providers**
          - Allowlisted object path and JSON fields
          - Valid PNG (IHDR, size, encoding)
          - Self-signature by the identity address over the canonical info
          - Identity registered in the EntityManager; entity fields re-fetched on ingest

          **Dapps**
          - Allowlisted object path and JSON fields
          - Valid PNG; submitter signature over content + logoHash
          - Stake check enforced at intake; fields re-validated on ingest

          CI re-verifies provider signatures on this PR. Review before merge.
          EOF
          )"
          else
            echo "Updated existing pull request for $BRANCH"
          fi
