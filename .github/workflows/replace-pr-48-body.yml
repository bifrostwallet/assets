name: Replace PR 48 body

# One-shot. Replaces the pull request description from .github/pr-48-body.md.
# Removed in the following commit.

on:
  push:
    branches:
      - feature/dev-4908-onchain-symbols

permissions:
  contents: read
  pull-requests: write

jobs:
  replace-body:
    name: Replace body
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Replace pull request body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit 48 --repo bifrostwallet/assets --body-file .github/pr-48-body.md
