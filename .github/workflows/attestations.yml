# Registry signatures and build attestations (npm provenance) of every package
# in yarn.lock. Needs the network, so it is not part of security-checks.sh.
# Runs when the lockfile changes, and when the baseline, the pinned Node (whose
# npm is the verifier) or the check itself changes. See base-repository
# docs/security-scripts.md:
# https://github.com/TowoLabs/base-repository/blob/main/docs/security-scripts.md

name: Attestations

on:
  pull_request:
    branches: [main]
    paths:
      - yarn.lock
      - .yarnrc.yml
      - package-attestations.json
      - .node-version
      - scripts/security/verify-attestations.sh
      - .github/workflows/attestations.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE: "0"

jobs:
  attestations:
    name: Verify attestations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Run security checks
        run: ./scripts/security/security-checks.sh

      # Nothing is installed: the verifier is the npm inside the pinned Node.
      - name: Verify registry signatures and build attestations
        run: ./scripts/security/verify-attestations.sh
