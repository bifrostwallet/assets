name: Publish release

# Stages @bifrostwallet/assets on the public npm registry with provenance
# (npm Trusted Publishing / OIDC). A maintainer approves the staged version
# on npmjs.com before it becomes installable.
#
# Gate: create a GitHub Release whose tag matches releaseTagForVersion,
# or use workflow_dispatch with publish=true.
# From 1.0.0 the tag is the package version (for example 1.0.0), with no v.
# 0.x tags keep a leading v (for example v0.1.0-beta).
# Published logoURLs are relative to data/ on that tag. createAssets() defaults to
# https://cdn.jsdelivr.net/gh/bifrostwallet/assets@<tag>/data/
# The package is staged on the latest dist-tag. A version containing "-" is refused.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Stage dist/ on npmjs.com (false = build-only dry run)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing + provenance

env:
  COREPACK_ENABLE: "0"

jobs:
  publish:
    name: Build and stage @bifrostwallet/assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          # Release publishes must not reuse a stale install cache
          package-manager-cache: false

      # Staged publishing needs npm CLI ≥ 11.15.0
      - name: Ensure recent npm CLI
        run: npm install -g npm@12.2.1

      - name: Install dependencies
        run: ./yarn install --immutable

      # Fails when any signature entry is invalid. Unsigned providers are warnings.
      - name: Verify provider signatures
        run: ./yarn verify:providers

      - name: Build publishable package
        run: ./yarn build:package

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./dist/package.json').version")"
          # releaseTagForVersion: 0.x keeps a leading v. From 1.0.0 the tag is the version.
          VERSION="$VERSION" TAG="$TAG" node --input-type=module <<'EOF'
          import { releaseTagForVersion } from "./build/src/releaseTag.js";

          const version = process.env.VERSION ?? "";
          const tag = process.env.TAG ?? "";
          if (tag.startsWith("vv")) {
            console.error(`Release tag ${tag} must not start with vv`);
            process.exit(1);
          }
          const expected = releaseTagForVersion(version);
          if (tag !== expected) {
            console.error(`Release tag ${tag} must be ${expected} (dist/package.json version)`);
            process.exit(1);
          }
          EOF

      - name: Stage on npm with provenance
        if: github.event_name == 'release' || inputs.publish == true
        run: |
          case "$(node -p "require('./dist/package.json').version")" in
            *-*)
              echo "Refusing a version that contains -" >&2
              exit 1
              ;;
          esac
          npm stage publish ./dist --access public --tag latest
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        run: |
          {
            echo "Built dist/ only (publish=false)."
            echo "Version: $(node -p "require('./dist/package.json').version")"
            echo ""
            echo "To stage this version, re-run with publish=true."
            echo "Then approve the staged version on npmjs.com."
          } >> "$GITHUB_STEP_SUMMARY"
