name: Publish release

# Stages @bifrostwallet/assets on the public npm registry with provenance
# (npm Trusted Publishing / OIDC). A maintainer approves the staged version
# on npmjs.com before it becomes installable.
#
# Gate: create a GitHub Release whose tag equals the package version
# (x.y.z, for example 1.0.0), or use workflow_dispatch with publish=true.
# Published logoURLs are relative to data/ on that tag. createAssets() defaults to
# https://cdn.jsdelivr.net/gh/bifrostwallet/assets@<tag>/data/
# The package is staged on the latest dist-tag. The release tag and the staged
# version must be x.y.z: digits only, no pre-release or build suffix.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Stage dist/ on npmjs.com (false = build-only dry run)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing + provenance

env:
  COREPACK_ENABLE: "0"

jobs:
  publish:
    name: Build and stage @bifrostwallet/assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Release tags are x.y.z. workflow_dispatch has no tag input; the publish
      # step checks the staged version with the same pattern.
      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        shell: sh
        run: |
          set -eu
          case "$TAG" in ''|*[!0-9.]*) echo 'Refusing: not plain x.y.z' >&2; exit 1 ;; esac
          if ! printf '%s\n' "$TAG" | grep -Eqx \
            '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'; then
            echo 'Refusing tag: expected x.y.z (digits only, no suffix)' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Always runs the check on a release, and on a manual run (no parent
      # commit in this checkout).
      - name: Check workflow tag rules
        run: ./scripts/security/verify-version-tags-if-changed.sh

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          # Release publishes must not reuse a stale install cache
          package-manager-cache: false

      # Staged publishing needs npm CLI ≥ 11.15.0
      - name: Ensure recent npm CLI
        run: npm install -g npm@12.2.1

      - name: Install dependencies
        run: ./yarn install --immutable

      # Fails when any signature entry is invalid. Unsigned providers are warnings.
      - name: Verify provider signatures
        run: ./yarn verify:providers

      - name: Build publishable package
        run: ./yarn build:package

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./dist/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag $TAG must equal $VERSION (package.json version)" >&2
            exit 1
          fi

      - name: Stage on npm with provenance
        if: github.event_name == 'release' || inputs.publish == true
        shell: sh
        run: |
          set -eu
          VERSION="$(node -p "require('./dist/package.json').version")"
          case "$VERSION" in ''|*[!0-9.]*) echo 'Refusing: not plain x.y.z' >&2; exit 1 ;; esac
          if ! printf '%s\n' "$VERSION" | grep -Eqx \
            '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'; then
            echo 'Refusing version: expected x.y.z (digits only, no suffix)' >&2
            exit 1
          fi
          npm stage publish ./dist --access public --tag latest
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        run: |
          {
            echo "Built dist/ only (publish=false)."
            echo "Version: $(node -p "require('./dist/package.json').version")"
            echo ""
            echo "To stage this version, re-run with publish=true."
            echo "Then approve the staged version on npmjs.com."
          } >> "$GITHUB_STEP_SUMMARY"
