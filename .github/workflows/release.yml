name: Publish release

# Stages @bifrostwallet/assets on the public npm registry with provenance
# (npm Trusted Publishing / OIDC). A maintainer approves the staged version
# on npmjs.com before it becomes installable.
#
# Gate: create a GitHub Release whose tag is v<package.json version>
# (for example v1.0.0), or use workflow_dispatch with publish=true.
# Published logoURLs are relative to data/ on that tag. createAssets() defaults to
# https://cdn.jsdelivr.net/gh/bifrostwallet/assets@<that-tag>/data/
# The package is staged on the latest dist-tag. A version containing "-" is refused.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Stage dist/ on npmjs.com (false = build-only dry run)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing + provenance

env:
  COREPACK_ENABLE: "0"

jobs:
  publish:
    name: Build and stage @bifrostwallet/assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          # Release publishes must not reuse a stale install cache
          package-manager-cache: false

      # Staged publishing needs npm CLI ≥ 11.15.0
      - name: Ensure recent npm CLI
        run: npm install -g npm@12.2.1

      - name: Install dependencies
        run: ./yarn install --immutable

      # Fails when any signature entry is invalid. Unsigned providers are warnings.
      - name: Verify provider signatures
        run: ./yarn verify:providers

      - name: Build publishable package
        run: ./yarn build:package

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./dist/package.json').version")"
          # Same rule as releaseTagForVersion: one leading v, added once.
          EXPECTED="v${VERSION}"
          case "$TAG" in
            vv*)
              echo "Release tag $TAG must not start with vv" >&2
              exit 1
              ;;
          esac
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Release tag $TAG must be $EXPECTED (dist/package.json version)" >&2
            exit 1
          fi
          VERSION="$VERSION" EXPECTED="$EXPECTED" node --input-type=module <<'EOF'
          import { releaseTagForVersion } from "./build/src/releaseTag.js";

          const version = process.env.VERSION ?? "";
          const expected = process.env.EXPECTED ?? "";
          const tag = releaseTagForVersion(version);
          if (tag !== expected) {
            console.error(`releaseTagForVersion returned ${tag}, workflow EXPECTED is ${expected}`);
            process.exit(1);
          }
          EOF

      - name: Stage on npm with provenance
        if: github.event_name == 'release' || inputs.publish == true
        run: |
          case "$(node -p "require('./dist/package.json').version")" in
            *-*)
              echo "Refusing a version that contains -" >&2
              exit 1
              ;;
          esac
          npm stage publish ./dist --access public --tag latest
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        run: |
          {
            echo "Built dist/ only (publish=false)."
            echo "Version: $(node -p "require('./dist/package.json').version")"
            echo ""
            echo "To stage this version, re-run with publish=true."
            echo "Then approve the staged version on npmjs.com."
          } >> "$GITHUB_STEP_SUMMARY"
