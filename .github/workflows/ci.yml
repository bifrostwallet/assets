name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pull requests, including the nightly catalog PR, cancel the previous run.
# Pushes to main never cancel an in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  COREPACK_ENABLE: "0"

jobs:
  # Status check name. Lint and the catalog tests run in this job.
  lint:
    name: "Lint & Test"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parent commit, for "Check workflow tag rules" below.
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Run security checks
        run: ./scripts/security/security-checks.sh

      # Runs the check when this change touches .github/ or the check itself,
      # and says so when it skips.
      - name: Check workflow tag rules
        run: ./scripts/security/verify-version-tags-if-changed.sh

      # Offline: the rules of the attestation gate, not the registry check itself.
      - name: Test attestation gate rules
        run: ./scripts/security/verify-attestations-fixtures.sh

      # Offline: when the launcher adds --check-cache, not the check itself.
      - name: Test Yarn launcher rules
        run: ./scripts/security/yarn-launcher-fixtures.sh

      # Offline: which PnP file states the check after install accepts.
      - name: Test PnP file check rules
        run: ./scripts/security/verify-pnp-files-fixtures.sh

      - name: Install dependencies
        run: ./yarn install --immutable

      # The install rewrote .pnp.cjs / .pnp.loader.mjs from yarn.lock. Any
      # difference from the commit means the committed loaders are not what
      # Yarn generates (they run on every ./yarn run, and nobody reviews them).
      - name: Verify committed PnP files match the install
        run: ./scripts/security/verify-pnp-files.sh

      # ShellCheck and yamllint are preinstalled on GitHub's ubuntu-24.04
      # runner image; nothing is downloaded or installed at CI time.
      - name: Lint shell scripts
        run: ./scripts/lint-shell.sh

      - name: Lint YAML
        run: ./scripts/lint-yaml.sh

      # Offline: which .claude/skills states the security checks accept.
      - name: Test agent skill pin rules
        run: ./scripts/security/verify-agent-skills-fixtures.sh

      # Offline: what the comment scanner counts and what the gate accepts.
      - name: Test comment gate rules
        run: ./scripts/lint-comments-fixtures.sh

      # Line count against the base branch. A new hash is allowed when the
      # count does not grow. PR_BASE_SHA is empty on a push; the script then
      # compares with the parent commit. The checkout does not keep
      # credentials, so the job token is what lets the script fetch a base
      # sha that is not already local.
      - name: Check for new comments
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/lint-comments.sh

      - name: Lint with Biome
        run: ./yarn lint

      - name: Typecheck
        run: ./yarn typecheck

      - name: Verify no outreach PII under data/
        run: ./yarn verify:no-contact-pii

      - name: Test
        run: ./yarn test

      - name: Verify provider signatures
        run: ./yarn verify:providers

      - name: Check provider catalog
        run: ./yarn check:providers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check token catalog
        run: ./yarn check:tokens

      - name: Check dapp catalog
        run: ./yarn check:dapps

      - name: Check contract catalog
        run: ./yarn check:contracts
