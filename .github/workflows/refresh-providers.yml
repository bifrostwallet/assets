name: Refresh providers

# Nightly: publish private Earn APY to GCS (no human gate) and commit unsigned
# domainLinked flags straight to main. Providers that burned FSP rewards
# (eligibleForReward=false in the latest fsp-rewards passes.json — zero passes
# plus another FTSO/FDC/staking minimal-condition failure) get listed:false on
# a branch with a pull request; curators review before merge.

on:
  schedule:
    - cron: "47 6 * * *" # daily 06:47 UTC (after pull-submissions)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  COREPACK_ENABLE: "0"
  EARN_BUCKET: ${{ vars.EARN_BUCKET }}

jobs:
  refresh:
    name: Publish earn APY and update catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require EARN_BUCKET variable
        run: |
          if [ -z "${{ vars.EARN_BUCKET }}" ]; then
            echo "Set repository variable EARN_BUCKET (Settings → Secrets and variables → Actions → Variables)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Commit + push back to the default branch
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: ./yarn install --immutable

      - name: Refresh earn APY and domain linkage
        run: ./yarn refresh:providers --write-domain
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish catalog refresh summary
        if: always()
        run: |
          if [ -f delist-summary.md ]; then
            cat delist-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit domain linkage updates to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/providers/
          if git diff --staged --quiet; then
            echo "No domain linkage changes to commit"
            exit 0
          fi
          git commit -m "Nightly domain linkage refresh"
          git push origin HEAD:main

      - name: Apply delist candidates (FSP rewards burned)
        run: ./yarn refresh:providers --write-delist --skip-earn --skip-domain
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Open delist pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/providers/
          if git diff --staged --quiet; then
            echo "No delist changes; skipping pull request"
            exit 0
          fi

          BRANCH=nightly/fsp-delist
          git checkout -B "$BRANCH"
          git commit -m "Delist providers that burned FSP rewards"
          git fetch origin "$BRANCH" || true
          git push -u origin "HEAD:refs/heads/$BRANCH" --force-with-lease

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "Delist providers that burned FSP rewards" \
              --body-file delist-summary.md
          else
            echo "Updated existing pull request for $BRANCH"
          fi
