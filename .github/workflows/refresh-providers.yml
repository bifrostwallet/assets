name: Refresh providers

# Nightly: publish private Earn APY to GCS (no human gate). Domain linkage,
# delist, and chain-drift edits stay in the working tree and land together on
# one pull request (nightly/fsp-delist). Nothing in this job pushes to main.
# A provider is suggested listed:false when it burned FSP rewards
# (eligibleForReward=false in the latest passes.json — zero passes plus another
# FTSO/FDC/staking minimal-condition failure) or breaks Bifrost's
# delegation-fee recommendation (current FTSO fee, or any currently validating
# Flare validator fee, above 50%). Curators review before merge.

on:
  schedule:
    - cron: "47 6 * * *" # daily 06:47 UTC (after pull-submissions)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  COREPACK_ENABLE: "0"
  EARN_BUCKET: ${{ vars.EARN_BUCKET }}

jobs:
  refresh:
    name: Publish earn APY and update catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require EARN_BUCKET variable
        run: |
          if [ -z "${{ vars.EARN_BUCKET }}" ]; then
            echo "Set repository variable EARN_BUCKET (Settings → Secrets and variables → Actions → Variables)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Push nightly/fsp-delist and open the catalog pull request. Not main.
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: ./yarn install --immutable

      - name: Refresh earn APY and domain linkage
        run: ./yarn refresh:providers --write-domain --skip-chain
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Apply delist candidates and chain drift
        run: ./yarn refresh:providers --write-delist --write-chain --skip-earn --skip-domain
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # After both refresh runs so the job summary matches the PR body.
      - name: Publish catalog refresh summary
        if: always()
        run: |
          if [ -f delist-summary.md ]; then
            cat delist-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update catalog pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Domain linkage is still uncommitted. Delist and chain edits from the
          # previous step are in the same tree. One branch, one pull request.
          git add data/providers/
          if git diff --staged --quiet; then
            echo "No catalog updates; skipping pull request"
            exit 0
          fi

          BRANCH=nightly/fsp-delist
          git checkout -B "$BRANCH"
          git commit -m "Suggest catalog updates from domain linkage, chain, and FSP rewards"
          git fetch origin "$BRANCH" || true
          git push -u origin "HEAD:refs/heads/$BRANCH" --force-with-lease

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH" \
              --title "Suggested catalog updates" \
              --body-file delist-summary.md
          else
            # Replace the body. A later night must not keep the previous night's text.
            gh pr edit --body-file delist-summary.md
            echo "Updated existing pull request for $BRANCH"
          fi
