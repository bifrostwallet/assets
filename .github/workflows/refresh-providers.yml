name: Refresh providers

# Nightly: domain linkage, delist, chain-drift, management-group, and
# dual-network edits stay in the working tree and land together on one pull
# request (nightly/fsp-delist). Nothing in this job pushes to main. A failed
# EntityManager or PollingManagementGroup read fails the job instead of
# skipping that field. Dual network is written on the second refresh, after
# domain linkage is on disk, so the pull request summary counts those edits.
# The first command passes --skip-delist so the listing-fee scan runs once, on
# the chain pass.
# A provider is suggested listed:false when it burned FSP rewards
# (eligibleForReward=false in the latest passes.json — zero passes plus another
# FTSO/FDC/staking minimal-condition failure) or breaks Bifrost's
# delegation-fee recommendation (current FTSO fee, or any currently validating
# Flare validator fee, above 50%). Curators review before merge.

on:
  schedule:
    - cron: "47 6 * * *" # daily 06:47 UTC (after pull-submissions)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  COREPACK_ENABLE: "0"

jobs:
  refresh:
    name: Update catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Push nightly/fsp-delist and open the catalog pull request. Not main.
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: ./yarn install --immutable

      - name: Refresh domain linkage
        run: ./yarn refresh:providers --write-domain --skip-chain --skip-delist
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Apply delist candidates, chain drift, management group, and dual network
        run: ./yarn refresh:providers --write-delist --write-chain --write-dual-network --skip-domain
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # After both refresh runs so the job summary matches the PR body.
      - name: Publish catalog refresh summary
        if: always()
        run: |
          if [ -f delist-summary.md ]; then
            cat delist-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update catalog pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Domain linkage is still uncommitted. Delist, chain, management-group,
          # and dual-network edits from the previous step are in the same tree.
          # One branch, one pull request.
          git add data/providers/
          if git diff --staged --quiet; then
            echo "No catalog updates; skipping pull request"
            exit 0
          fi

          BRANCH=nightly/fsp-delist
          git checkout -B "$BRANCH"
          git commit -m "Suggest catalog updates from domain linkage, dual network, chain, management group, and FSP rewards"
          git fetch origin "$BRANCH" || true
          git push -u origin "HEAD:refs/heads/$BRANCH" --force-with-lease

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH" \
              --title "Suggested catalog updates" \
              --body-file delist-summary.md
          else
            # Replace the body. A later night must not keep the previous night's text.
            gh pr edit --body-file delist-summary.md
            echo "Updated existing pull request for $BRANCH"
          fi
